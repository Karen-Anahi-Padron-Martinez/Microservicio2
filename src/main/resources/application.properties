spring.application.name=Ejercicio5Cliente
server.port=8082

# Forzar codificación UTF-8 en peticiones y vistas HTML/Thymeleaf
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# URL base del microservicio API (Microservicio1)
api.base-url=${API_BASE_URL:http://localhost:8081}

# Observabilidad (Actuator): health para Docker/monitoreo y métricas en formato Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Histograma de latencias HTTP: permite calcular p95/p99 en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
