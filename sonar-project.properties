# Proyecto SonarQube del FRONTEND (JavaScript, CSS y plantillas Thymeleaf del Cliente web).
# El código Java de este mismo repositorio se analiza aparte con el sonar-maven-plugin (pom.xml).
sonar.projectKey=microservicio2-frontend
sonar.projectName=Microservicio2 - Frontend (JS/HTML/CSS)
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/resources/static/js,src/main/resources/static/css,src/main/resources/templates
sonar.tests=src/test/js

# Se excluyen artefactos generados y librerías de terceros incluidas como archivos estáticos
# (jQuery, Popper y Bootstrap minificados/empaquetados). Ningún archivo propio queda excluido.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/target/**,**/*.min.js,**/*.map,\
  src/main/resources/static/js/bootstrap*.js,src/main/resources/static/css/bootstrap*.css

# Cobertura generada por Jest (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
